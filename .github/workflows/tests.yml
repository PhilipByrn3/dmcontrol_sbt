name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (exact research versions)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Validation statistics on this platform
        run: python -m sbtenv.validation.check_reference || true
      - name: Test
        run: pytest -q -rs
